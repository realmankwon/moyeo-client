<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font:14px -apple-system,sans-serif;line-height:1.8;color:#303744;padding:20px}h1{font-size:24px}strong{color:#574713}</style><h1>모여를 설치합니다</h1><p>실행 중인 Moyeo가 있으면 macOS 설치 프로그램이 종료를 요청합니다. <strong>종료에 동의하면 기존 앱을 새 버전으로 교체합니다.</strong></p><p>설치 위치는 /Applications/Moyeo.app입니다. 개인 설정과 로그인 정보는 기존 사용자 데이터 폴더에 유지합니다.</p><p>작성하거나 전송 중인 메시지를 확인한 뒤 계속하세요. 앱 창을 닫기만 하면 메뉴 막대에서 계속 실행될 수 있습니다.</p></html>
